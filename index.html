<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex-wrap</title>
</head>
<style>
    .container{
        height: 600px;
        width: 600px;
        background-color: aquamarine;
        display: flex;
        flex-direction: row ;
        flex-wrap: wrap;
    }

    .box{
        height: 250px;
        width: 400px;
        background-color: bisque;
        margin: 5px;
    }
</style>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
    </div>
</body>
</html>
