<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexwrap</title>
    <style>
        .container{
            height: 620px;
            width: 500px;
            background-color: goldenrod;
            display: flex;
            flex-direction: row;
            gap: 8px;
        }

        .box{
            height: 100px;
            width: 100px;
            background-color: antiquewhite;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 600;
        }

        .box1{
           order: 0;
        }

        .box2{
            order: -1;
        }

        .box3{
            order: 0
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
    </div>
</body>
</html>
