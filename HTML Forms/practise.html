<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" name="uname" id="name" ><br><br>
        <label for="fname">Fathers name: </label>
        <input type="text" name="fname" id="fname"><br><br>
        <label for="age">Age: </label>
        <input type="number" name="age" id="age"><br><br>
        <label for="password">Password:</label>
        <input type="password" name="password" id="password"><br><br>

        <!--Radio Btn-->
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="others">Others</label>
        <input type="radio" id="others" name="gender" value="others">
        <br><br>
        <!--Checkbox-->
        <label for="c++">C++</label>
        <input type="checkbox" name="language" id="c++" value="cplus">
        <label for="java">Java</label>
        <input type="checkbox" name="language" id="java" value="java">
        <label for="html">HTML</label>
        <input type="checkbox" name="language" id="html" value="html">
        <br><br>
        <!--Btn-->
        <button type="submit">Submit</button>
    </form>
</body>
</html>
