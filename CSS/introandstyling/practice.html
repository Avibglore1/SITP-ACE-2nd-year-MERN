<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>FLEXBOX</title>
    <style type="text/tailwindcss">

        *{
            padding: 0;
            margin: 0;
        }
        div{
            
            background-color: aquamarine;
            display: flex;
            
        }

        section{
            height: 100px;
            width: 100px;
            background-color: brown;
            margin: 8px;
        }

        .box2{
            
            flex-shrink: 2;
        }

        .box3{
            flex-basis: 1;
        }

    </style>
</head>
<body>
    <div class="p-4 text-xl h-[600px] w-[600px] ">
        <section class="box1">Block1</section>
        <section class="box2">Block2</section>
        <section class="box3">Block3</section>

    </div>
</body>
</html>
