<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color:darkgoldenrod;
            height: 150px;
            width: 300px;
            position: relative;
        }

        .box{
            position: absolute;
            background-color:rgb(48, 14, 197);
        }

        .box1{
            height: 60px;
            width: 60px;
            top: 0px;
            left:0px
        }

        .box2{
            height: 60px;
            width: 200px;
            right: 0px;
            top: 0px;
        }

        .box3{
            height: 60px;
            width: 60px;
            left: 0px;
            bottom:0px;
        }

        .box4{
            height: 60px;
            width: 200px;
            bottom: 0px;
            right: 0px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
