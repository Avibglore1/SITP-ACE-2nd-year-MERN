<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .container{
            height: 800px;
            background-color: aqua;
            position: relative;
        }

        .box{
            background-color: orange;
            height: 200px;
            width: 200px;
            animation-name: moving;
            animation-duration: 5s ;
            animation-iteration-count: 1;
            animation-fill-mode: forwards;
            position: absolute;
        }

        @keyframes moving {
            0%{
                top: 0px;
                left: 0px;
                background-color: aquamarine;
            }
            25%{
                top: 0px;
                left: 300px;
                background-color: rgb(77, 152, 127);
            }
            50%{
                top: 600px;
                left: 300px;
                background-color: rgb(17, 173, 121);
            }
            75%{
                left: 0px;
                top: 600px;
                background-color: rgb(128, 149, 142);
            }
            100%{
                top: 0px;
                left: 0px;
                background-color: aquamarine;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
