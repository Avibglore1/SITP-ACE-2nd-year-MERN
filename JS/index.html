<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todolist</title>
</head>
<body>
    <input type="text">
    <button>Add</button>
    <script>
        let orderedList = document.createElement("ol");
        document.body.appendChild(orderedList);
        orderedList.style.width = "300px"
        let buttonEl = document.querySelector("button");
        buttonEl.addEventListener("click", function(){
            let listEl = document.createElement("li");
            let inputValue = document.querySelector("input").value;
            orderedList.appendChild(listEl);
            let containerEl = document.createElement("div");
            listEl.appendChild(containerEl);
            let spanEl = document.createElement("span");
            spanEl.textContent = inputValue;
            let btnEl = document.createElement("button");
            btnEl.textContent = "❌";
            containerEl.appendChild(spanEl);
            containerEl.appendChild(btnEl);
            containerEl.style.display = "flex";
            containerEl.style.justifyContent = "space-evenly"
            containerEl.style.gap = "15px";
            listEl.style.border = "3px solid orange";
            btnEl.addEventListener("click", function(){
                listEl.remove();
            })

        })
    </script>
</body>
</html>
