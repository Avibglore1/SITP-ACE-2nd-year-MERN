<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: rgb(45, 26, 189);
            height: 400px;
            width: 500px;
            position: relative;
        }

        .one{
            height: 400px;
            width: 50px;
            background-color: yellow;
            position: absolute;
            left: 120px;
        }

        .two{
            height: 50px;
            width: 500px;
            background-color: yellow;
            position: absolute;
            bottom: 180px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="one"> </div>
        <div class="two"></div>
    </div>
</body>
</html>
