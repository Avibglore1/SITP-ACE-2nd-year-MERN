<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html form</title>
</head>
<body style="background-color:bisque">
    <h1 style="text-align: center"; >Registration Form</h1>
    <form action="">
        <!--Name-->
        <label for="name">Name:</label>
        <input 
        type="text" 
        name="name" 
        id="name" 
        pattern="[A-Za-z]"
        title="Please enter only alphabets" required
        ><br><br>
        <!--fathers name-->
         <label for="fname">Fathers name:</label>
        <input type="text" name="fname" id="fname" ><br><br>
        <!--age-->
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" ><br><br>
        <!--password-->
        <label for="pass">Password</label>
        <input type="password" name="" id="pass" ><br><br>
        <!--radio btn-->
        <label for="male">male</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="female">female</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="others">others</label>
        <input type="radio" name="gender" id="others" value="others"><br><br>
        <!--checkbox-->
        <label for="c++">C++</label>
        <input type="checkbox" name="language" id="c++" value="cplus">
        <label for="java">java</label>
        <input type="checkbox" name="language" id="java" value="java">
        <label for="html">html</label>
        <input type="checkbox" name="language" id="html" value="html"><br><br>
        <!--submit btn-->
        <button type="submit">Submit</button>
    </form>
   
</body>
</html>
